# common is a backup configuration
common:
  ## Everything will be copies/output here
  destination: ~/2025-11-andy-mac-refresh
  ## Write directory lists to file. Can be helpful in auditing installed applications, etc.
  listings:
    applications: /Applications
    code: ~/Code
  # Execute commands to generate lists
  commands:
    brew: brew list --versions
    npm: npm list -g --depth=0
  # Copy entire directories or limit by name
  mappings:
    - from: '~'
      to: home
      paths:
        - .bash_profile
        - .git-completion.bash
        - .git-prompt.sh
        - .gitconfig
        - .npmrc
        - .ssh
        - .vscode
        - bin
  ## Back up code configuration files
  app-config:
    from: ~/Code
    to: app-config
    files:
      include:
        - .env
        - config.y*ml
    directories:
      exclude:
        - node_modules
        - target
        - dist
        - build
        - vendor
      include:
        - .idea
        - group_vars
        - host_vars
        - .vscode
